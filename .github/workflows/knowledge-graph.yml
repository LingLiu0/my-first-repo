name: Generate Knowledge Graph

on:
  push:
    branches:
      - main
    paths:
      - 'weekly-news/**'
  workflow_dispatch:

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Extract keywords from documents
        run: node scripts/extract-keywords.js

      - name: Generate knowledge graph data
        run: node scripts/generate-graph.js

      - name: Upload graph data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph
          path: docs/graph-data.json

  deploy:
    needs: generate-graph
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download graph data
        uses: actions/download-artifact@v4
        with:
          name: knowledge-graph
          path: docs/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
